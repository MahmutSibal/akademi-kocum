# Akademi Koçum — yerel backend
# Çalıştırma:  cd backend && cp .env.example .env && docker compose up -d
#
# İki mod, .env içindeki COMPOSE_PROFILES ile seçilir:
#   COMPOSE_PROFILES=            -> yalnızca n8n konteyneri; SQL Server ve Ollama
#                                   bilgisayarda kurulu olanlar (host.docker.internal)
#   COMPOSE_PROFILES=mssql,ollama -> her şey Docker'da: sqlserver, db-init,
#                                   ollama, ollama-pull, n8n

name: akademi-kocum

services:
  # ---------------------------------------------------------------- SQL Server
  sqlserver:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ak-sqlserver
    # Yalnızca x86_64. Apple Silicon'da Docker Desktop > Rosetta açık olmalı.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env içinde tanımlı olmalı}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [study-net]

  # init.sql'i çalıştırır ve kapanır. Şema idempotent; her `up`'ta güvenle tekrar çalışır.
  # Host modunda bunun yerine: powershell -File scripts/init-local.ps1
  db-init:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ak-db-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-study_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD .env içinde tanımlı olmalı}
    volumes:
      - ./sql:/sql:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/db-init.sh"]
    restart: "no"
    networks: [study-net]

  # -------------------------------------------------------------------- Ollama
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: ak-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [study-net]
    # NVIDIA GPU varsa (NVIDIA Container Toolkit / Docker Desktop WSL2 GPU desteği) açın:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # .env'deki modeli ilk çalıştırmada indirir; model zaten varsa saniyeler içinde biter.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: ak-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo \"[ollama-pull] $$OLLAMA_MODEL indiriliyor...\" && ollama pull \"$$OLLAMA_MODEL\" && echo '[ollama-pull] hazır.'"]
    restart: "no"
    networks: [study-net]

  # ----------------------------------------------------------------------- n8n
  # Tek seferlik: SQL credential'ı + workflow'ları import edip aktifleştirir.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: ak-n8n-import
    depends_on:
      db-init:
        condition: service_completed_successfully
        required: false
    environment:
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      APP_DB_HOST: ${APP_DB_HOST:-sqlserver}
      APP_DB_PORT: ${APP_DB_PORT:-1433}
      APP_DB_USER: ${APP_DB_USER:-study_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      BREVO_SMTP_FROM_EMAIL: ${BREVO_SMTP_FROM_EMAIL:-}
      BREVO_SMTP_FROM_NAME: ${BREVO_SMTP_FROM_NAME:-Akademi Koçum}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/n8n-import.sh"]
    restart: "no"
    networks: [study-net]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: ak-n8n
    restart: unless-stopped
    # required: false -> profil kapalıyken (host modu) bu bağımlılıklar yok sayılır
    depends_on:
      sqlserver:
        condition: service_healthy
        required: false
      db-init:
        condition: service_completed_successfully
        required: false
      ollama:
        condition: service_healthy
        required: false
      n8n-import:
        condition: service_completed_successfully
    # Linux'ta da host.docker.internal çözülsün diye (Docker Desktop'ta zaten var)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # n8n'in kendi iş akışı verisi SQLite'ta kalır (SQL Server desteklenmez).
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY .env içinde tanımlı olmalı}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"           # LAN üzerinden http erişimi için
      GENERIC_TIMEZONE: ${TZ:-Europe/Istanbul}
      TZ: ${TZ:-Europe/Istanbul}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168          # saat (7 gün)
      # Code node'larında `crypto` (şifre hash'i, JWT) ve $env erişimi
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # İş akışlarının $env üzerinden okuduğu uygulama ayarları
      # Host modu: http://host.docker.internal:11434 — Docker modu: http://ollama:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-180000}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-10}
      QUIZ_MAX_RETRIES: ${QUIZ_MAX_RETRIES:-2}
      MAX_LLM_INPUT_CHARS: ${MAX_LLM_INPUT_CHARS:-12000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Defter fotoğrafından not: görsel (vision) model
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:12b}
      OLLAMA_VISION_TIMEOUT_MS: ${OLLAMA_VISION_TIMEOUT_MS:-600000}
      JWT_SECRET: ${JWT_SECRET:-}
      # Haftalık e-posta raporu (Brevo SMTP credential'ı n8n-import oluşturur)
      BREVO_SMTP_FROM_EMAIL: ${BREVO_SMTP_FROM_EMAIL:-}
      BREVO_SMTP_FROM_NAME: ${BREVO_SMTP_FROM_NAME:-Akademi Koçum}
      WEEKLY_REPORT_ENABLED: ${WEEKLY_REPORT_ENABLED:-false}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro     # export edilen workflow JSON'ları
    networks: [study-net]

networks:
  study-net:
    name: study-net
    driver: bridge

volumes:
  mssql-data:
  ollama-data:
  n8n-data:
